<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Placeholder design-system vars for preview only — real deck defines these elsewhere */
  :root {
    --t: #333;
    --radius: 6px;
    --border: #ccc;
    --border-strong: #999;
    --surface-1: #f5f5f5;
    --surface-2: #e2e2e2;
    --text-primary: #222;
    --text-secondary: #666;
    --text-accent: #2a6f6f;
  }
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #fff; padding: 24px; }
  .th { font-size: 14px; font-weight: 600; fill: var(--text-primary); }
  .ts { font-size: 11px; fill: #555; }
  .c-gray rect { fill: #f0f0f0; stroke: #aaa; }
  .c-teal rect { fill: #e6f3f3; stroke: #2a6f6f; }
  .c-purple rect { fill: #f2eefb; stroke: #7a5fc4; }
  .arr { stroke: var(--t); stroke-width: 1; }
</style>
</head>
<body>

<style>
.morphwrap text, .morphwrap line, .morphwrap path, .morphwrap g { transition: opacity .6s ease; }
.morphwrap .a-el, .morphwrap .b-el, .morphwrap .c-el, .morphwrap .d-el { opacity: 0; }
.morphwrap.state-a .a-el { opacity: 1; }
.morphwrap.state-b .b-el { opacity: 1; }
.morphwrap.state-c .c-el { opacity: 1; }
.morphwrap.state-d .d-el { opacity: 1; }

.morphwrap .split-vehicle { opacity: 0; }
.morphwrap.state-a .split-vehicle, .morphwrap.state-b .split-vehicle, .morphwrap.state-c .split-vehicle { opacity: 1; }
.morphwrap .single-vehicle { opacity: 0; }
.morphwrap.state-d .single-vehicle { opacity: 1; }

.morphwrap .connector1 { opacity: 1; }
.morphwrap.state-a .connector1 { opacity: 0; }

.case-title { font-size: 17px; font-weight: 700; fill: var(--text-primary); }
.th-sm { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }
.ts-sm { font-size: 9.5px; fill: #555; }
.th-md { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
.ts-md { font-size: 10.5px; fill: #555; }

.statebtn { padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); font-size: 13px; font-weight: 400; cursor: pointer; }
.statebtn.active { border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-weight: 500; }
</style>
<h2 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">A diagram that switches between the Mercy Corps, Ground Up Investing / Corus, One Acre Ventures, and Heifer Impact Capital structures</h2>

<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
<button class="statebtn active" id="btn-a" onclick="setState('a')">Mercy Corps</button>
<button class="statebtn" id="btn-c" onclick="setState('c')">Corus International</button>
<button class="statebtn" id="btn-b" onclick="setState('b')">One Acre Fund</button>
<button class="statebtn" id="btn-d" onclick="setState('d')">Heifer International</button>
</div>

<div class="morphwrap state-a" id="morphwrap">
<svg width="100%" viewBox="0 0 680 480" role="img">
<title>Mercy Corps, Ground Up Investing / Corus, One Acre Ventures, and Heifer Impact Capital structures</title>
<desc>A parent organization box, a fund row, and a portfolio box, all the same size, stacked in one column shifted slightly left of center. For Mercy Corps and One Acre Ventures, the fund row splits into two boxes side by side. For Mercy Corps, the parent and fund row have no direct connecting line; instead a right-angle arrow runs from the parent box to a Mercy Corps Ventures box off to the side, and a branching line runs from that box back into both fund boxes, showing Mercy Corps Ventures as the manager of both funds. The fund row connects to the portfolio box below it with a labeled arrow.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="case-title a-el" x="300" y="20" text-anchor="middle" dominant-baseline="central">Arms-length fund manager</text>
<text class="case-title c-el" x="300" y="20" text-anchor="middle" dominant-baseline="central">&quot;Future model for INGOs&quot;</text>
<text class="case-title b-el" x="300" y="20" text-anchor="middle" dominant-baseline="central">Adjacent diversification</text>
<text class="case-title d-el" x="300" y="20" text-anchor="middle" dominant-baseline="central">Integrated into programming</text>

<g transform="translate(0,24)">
<g class="c-gray">
<rect x="160" y="40" width="280" height="100" rx="12" stroke-width="0.5"/>
<text class="th a-el" x="300" y="72" text-anchor="middle" dominant-baseline="central">Mercy Corps</text>
<text class="th b-el" x="300" y="72" text-anchor="middle" dominant-baseline="central">One Acre Fund</text>
<text class="th c-el" x="300" y="72" text-anchor="middle" dominant-baseline="central">Corus International</text>
<text class="th d-el" x="300" y="72" text-anchor="middle" dominant-baseline="central">Heifer International</text>
<text class="ts a-el" x="300" y="92" text-anchor="middle" dominant-baseline="central">NGO, 40 offices</text>
<text class="ts b-el" x="300" y="92" text-anchor="middle" dominant-baseline="central">Staple crop farmer network</text>
<text class="ts c-el" x="300" y="92" text-anchor="middle" dominant-baseline="central">fmr. Lutheran World Relief</text>
<text class="ts d-el" x="300" y="92" text-anchor="middle" dominant-baseline="central">$15M seed capital, 3% interest</text>
<text class="ts a-el" x="300" y="110" text-anchor="middle" dominant-baseline="central">Core business is programming</text>
<text class="ts b-el" x="300" y="110" text-anchor="middle" dominant-baseline="central">Core business, field presence</text>
<text class="ts d-el" x="300" y="110" text-anchor="middle" dominant-baseline="central">Seed foundation recalled the line</text>
</g>

<line class="connector1" x1="300" y1="140" x2="300" y2="190" stroke="var(--t)" stroke-width="0.75" marker-end="url(#arrow)"/>
<text class="ts b-el" x="345" y="165">founded</text>
<text class="ts c-el" x="345" y="165">founded</text>
<text class="ts d-el" x="345" y="165">founded</text>

<g class="origin b-el">
<path d="M170 140 C90 190, 70 300, 200 340" fill="none" stroke="var(--t)" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="10" y="310">~50% of</text>
<text class="ts" x="10" y="326">origination</text>
</g>

<g class="c-teal split-vehicle">
<rect x="160" y="190" width="135" height="100" rx="12" stroke-width="0.5"/>
<text class="th-sm a-el" x="227.5" y="222" text-anchor="middle" dominant-baseline="central">Fund I</text>
<text class="ts-sm a-el" x="227.5" y="248" text-anchor="middle" dominant-baseline="central">Evergreen</text>
<text class="th-sm b-el" x="227.5" y="222" text-anchor="middle" dominant-baseline="central">IDH Investment Mgmt</text>
<text class="ts-sm b-el" x="227.5" y="248" text-anchor="middle" dominant-baseline="central">Fund manager</text>
<text class="th-sm c-el" x="227.5" y="222" text-anchor="middle" dominant-baseline="central">Ground Up Investing</text>
<text class="ts-sm c-el" x="227.5" y="248" text-anchor="middle" dominant-baseline="central">Fund I, self-managed</text>

<rect x="305" y="190" width="135" height="100" rx="12" stroke-width="0.5"/>
<text class="th-sm a-el" x="372.5" y="222" text-anchor="middle" dominant-baseline="central">Fund II</text>
<text class="ts-sm a-el" x="372.5" y="240" text-anchor="middle" dominant-baseline="central">Resilient Future Fund</text>
<text class="ts-sm a-el" x="372.5" y="256" text-anchor="middle" dominant-baseline="central">Climate adaptation</text>
<text class="th-sm b-el" x="372.5" y="222" text-anchor="middle" dominant-baseline="central">One Acre Ventures</text>
<text class="ts-sm b-el" x="372.5" y="240" text-anchor="middle" dominant-baseline="central">Warehouse phase</text>
<text class="ts-sm b-el" x="372.5" y="256" text-anchor="middle" dominant-baseline="central">Off balance sheet</text>
</g>

<g class="c-purple split-vehicle c-el">
<rect x="305" y="190" width="135" height="100" rx="12" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="th-sm" x="372.5" y="222" text-anchor="middle" dominant-baseline="central">GUI Fund II</text>
<text class="ts-sm" x="372.5" y="240" text-anchor="middle" dominant-baseline="central">$20M raising</text>
<text class="ts-sm" x="372.5" y="256" text-anchor="middle" dominant-baseline="central">then $75M Fund III</text>
</g>

<g class="c-teal single-vehicle">
<rect x="160" y="190" width="280" height="100" rx="12" stroke-width="0.5"/>
<text class="th d-el" x="300" y="222" text-anchor="middle" dominant-baseline="central">Heifer Impact Capital</text>
<text class="ts d-el" x="300" y="242" text-anchor="middle" dominant-baseline="central">No separate fund manager</text>
<text class="ts d-el" x="300" y="260" text-anchor="middle" dominant-baseline="central">35 direct deals, no intermediation</text>
</g>

<g class="a-el">
<path d="M440 90 L555 90 L555 195" fill="none" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M470 235 L455 235 L455 175 L227.5 175" fill="none" stroke="var(--t)" stroke-width="0.75"/>
<line x1="372.5" y1="175" x2="372.5" y2="190" stroke="var(--t)" stroke-width="0.75" marker-end="url(#arrow)"/>
<line x1="227.5" y1="175" x2="227.5" y2="190" stroke="var(--t)" stroke-width="0.75" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="470" y="195" width="170" height="80" rx="10" stroke-width="0.5"/>
<text class="th-md" x="555" y="222" text-anchor="middle" dominant-baseline="central">Mercy Corps Ventures</text>
<text class="ts-md" x="555" y="245" text-anchor="middle" dominant-baseline="central">Fund manager</text>
</g>
</g>

<g class="b-el">
<line x1="440" y1="225" x2="470" y2="225" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
<g class="c-purple">
<rect x="470" y="195" width="150" height="65" rx="10" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="th-sm" x="545" y="215" text-anchor="middle" dominant-baseline="central">1AV Fund phase</text>
<text class="ts-sm" x="545" y="232" text-anchor="middle" dominant-baseline="central">Oikocredit, AgDevCo,</text>
<text class="ts-sm" x="545" y="246" text-anchor="middle" dominant-baseline="central">ResponsAbility (planned)</text>
</g>
</g>


<line x1="300" y1="290" x2="300" y2="340" class="arr" marker-end="url(#arrow)"/>
<text class="ts a-el" x="315" y="315" text-anchor="start">Equity</text>
<text class="ts b-el" x="315" y="315" text-anchor="start">Debt</text>
<text class="ts c-el" x="315" y="315" text-anchor="start">Equity &#8594; Debt</text>
<text class="ts d-el" x="315" y="315" text-anchor="start">Direct loans</text>

<g class="c-purple">
<rect x="160" y="340" width="280" height="100" rx="12" stroke-width="0.5"/>
<text class="th a-el" x="300" y="372" text-anchor="middle" dominant-baseline="central">Portfolio companies</text>
<text class="th b-el" x="300" y="372" text-anchor="middle" dominant-baseline="central">Agri-SMEs</text>
<text class="th c-el" x="300" y="372" text-anchor="middle" dominant-baseline="central">GUI portfolio companies</text>
<text class="th d-el" x="300" y="372" text-anchor="middle" dominant-baseline="central">Farmers &amp; co-ops, direct</text>
<text class="ts a-el" x="300" y="396" text-anchor="middle" dominant-baseline="central">Social enterprises</text>
<text class="ts b-el" x="300" y="396" text-anchor="middle" dominant-baseline="central">Staple &#8594; cash-crop shift</text>
<text class="ts c-el" x="300" y="396" text-anchor="middle" dominant-baseline="central">Mountain Harvest, DelAgua + more</text>
<text class="ts d-el" x="300" y="396" text-anchor="middle" dominant-baseline="central">Since absorbed into "innovative finance"</text>
</g>
</g>
</svg>
</div>

<script>
var states = ['a','b','c','d'];
function setState(s) {
  var el = document.getElementById('morphwrap');
  states.forEach(function(st) {
    el.classList.remove('state-' + st);
    document.getElementById('btn-' + st).classList.remove('active');
  });
  el.classList.add('state-' + s);
  document.getElementById('btn-' + s).classList.add('active');
}
</script>

</body>
</html>
