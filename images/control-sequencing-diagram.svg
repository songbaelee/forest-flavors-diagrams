<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Control reasoning chain</title>
<desc>Flow diagram: the question of what control means, branching to IC control (rejected), branding and credit-taking (kept, open), and TA/lending sequencing (kept).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">What does "control" mean?</text>

<line x1="340" y1="64" x2="140" y2="118" stroke="#89877f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="64" x2="340" y2="118" stroke="#89877f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="64" x2="540" y2="118" stroke="#89877f" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="120" width="180" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="140" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441" text-decoration="line-through">IC control</text>
<text x="140" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5f5e5a">CRS controls neither IC</text>

<rect x="250" y="120" width="180" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Branding</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854f0b">Takes credit, owns the risk</text>

<rect x="450" y="120" width="180" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="540" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">TA/lending sequencing</text>
<text x="540" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0f6e56">Distinguishes Azure vs Isidro</text>
</svg>
