<svg width="680" height="190" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Revised control reasoning flow</title>
<desc>Flow diagram: what does control mean, branching to branding/credit-taking and TA/pipeline, both shown as single-line boxes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">What does "control" mean?</text>

<line x1="340" y1="64" x2="210" y2="118" stroke="#89877f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="64" x2="470" y2="118" stroke="#89877f" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="120" width="220" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="210" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Branding / credit</text>

<rect x="360" y="120" width="220" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="470" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">TA / pipeline</text>
</svg>
